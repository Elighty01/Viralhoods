<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viralhoods: trending news from every sector</title>
    <meta name="description" content="Short, clear summaries of what is trending in politics, finance, health, entertainment, research, science and AI." />
    <meta property="og:title" content="Viralhoods: trending news from every sector" />
    <meta property="og:description" content="Short, clear summaries of what is trending in politics, finance, health, entertainment, research, science and AI." />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="apple-touch-icon" href="./logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        background-color: #090d16;
        color: #f8fafc;
        font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .vh-preloader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .vh-preloader-logo {
        width: 140px;
        height: auto;
        margin-bottom: 24px;
        filter: drop-shadow(0 4px 14px rgba(41, 182, 246, 0.45));
        animation: vh-pulse 1.8s infinite ease-in-out;
      }
      @keyframes vh-pulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.04); opacity: 1; }
      }
      .vh-preloader-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #29b6f6;
        border-radius: 50%;
        animation: vh-spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes vh-spin {
        to { transform: rotate(360deg); }
      }
      .vh-preloader-title {
        font-size: 1.5rem;
        font-weight: 800;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      .vh-preloader-tagline {
        font-size: 0.92rem;
        color: #94a3b8;
        margin: 0;
        max-width: 420px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="vh-preloader">
        <img class="vh-preloader-logo" src="./logo.svg" alt="Viralhoods" />
        <div class="vh-preloader-spinner"></div>
        <h1 class="vh-preloader-title">Viralhoods</h1>
        <p class="vh-preloader-tagline">Trending summaries from every sector worldwide</p>
      </div>
    </div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
