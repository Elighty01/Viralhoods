<svg viewBox="0 0 200 144" width="200" height="144" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tablet Outer Bezel with subtle shadow and border -->
  <defs>
    <filter id="tablet-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="132" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2.5" filter="url(#tablet-shadow)" />

  <!-- Camera Lens dot on top bezel -->
  <circle cx="100" cy="12" r="2.5" fill="#64748b" />
  <circle cx="100" cy="12" r="1" fill="#0f172a" />

  <!-- Tablet White Screen Display -->
  <rect x="15" y="19" width="170" height="106" rx="8" fill="#ffffff" />

  <!-- Screen inner subtle highlight border -->
  <rect x="15" y="19" width="170" height="106" rx="8" stroke="#f1f5f9" stroke-width="1.5" />

  <!-- VIRAL Text in Cyan Blue with Black Contour Outline -->
  <text
    x="100"
    y="65"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Bricolage Grotesque', 'Arial Black', Impact, sans-serif"
    font-weight="900"
    font-size="34"
    letter-spacing="0.02em"
    fill="#29b6f6"
    stroke="#000000"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
    paint-order="stroke fill"
  >VIRAL</text>

  <!-- HOODS Text in Cyan Blue with Black Contour Outline -->
  <text
    x="100"
    y="106"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Bricolage Grotesque', 'Arial Black', Impact, sans-serif"
    font-weight="900"
    font-size="34"
    letter-spacing="0.02em"
    fill="#29b6f6"
    stroke="#000000"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
    paint-order="stroke fill"
  >HOODS</text>
</svg>
