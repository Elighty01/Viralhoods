<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Viralhoods admin</title><meta name=robots content=noindex><link rel=stylesheet href=style.css></head><body><header id=h></header><main class="w prose"><h1>Admin</h1><p>Run the news bot now. It runs on GitHub Actions, and new stories appear in 1 to 3 minutes.</p><p><input id=r size=34 placeholder="username/repository" aria-label="Repository"></p><p><input id=k type=password size=34 placeholder="GitHub token" aria-label="GitHub token"></p><p><button id=go>Refresh news now</button></p><p class=msg id=m role=status></p><p class=mut>Use a fine-grained token for this one repository with Actions read and write access. It is saved only in this browser. Never put it in the code.</p></main><footer id=f></footer><script src=app.js></script><script>
const say=t=>{$("m").textContent=t};
const parse=s=>{const m=s.match(/([\w-]+)\.github\.io\/([\w.-]+)/i)||s.match(/github\.com\/([\w-]+)\/([\w.-]+)/i)||s.trim().match(/^([\w-]+)\/([\w.-]+)$/);return m?m[1]+"/"+m[2].replace(/\.git$/,""):""};
$("r").value=localStorage.r||"";$("k").value=localStorage.k||"";
$("go").onclick=async()=>{
const repo=parse($("r").value),tok=$("k").value.replace(/[^\x21-\x7e]/g,"");
if(!repo)return say("Type your repository as username/repository, for example elighty01/Viralhoods.");
if(!tok)return say("Paste your GitHub token in the second box.");
localStorage.r=repo;localStorage.k=tok;say("Starting the bot...");
const H={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"},api="https://api.github.com/repos/"+repo;
try{
const info=await fetch(api,{headers:H});
if(!info.ok)return say(info.status==401?"GitHub did not accept this token. Make a new token and paste it again.":info.status==404?"GitHub cannot find "+repo+" with this token. Check the name, and that the token was made for this repository.":"GitHub sent error "+info.status+". Try again in a minute.");
const br=(await info.json()).default_branch||"main";
const x=await fetch(api+"/actions/workflows/news.yml/dispatches",{method:"POST",headers:H,body:JSON.stringify({ref:br})});
say(x.status==204?"Started. New stories appear in 1 to 3 minutes.":x.status==403?"This token cannot run workflows. Edit the token and set Actions to Read and write.":x.status==404?"The file .github/workflows/news.yml is missing from your repository. Upload it, then try again.":x.status==422?"The bot could not run on branch "+br+". Check that news.yml is on that branch.":"Could not start (error "+x.status+").")
}catch(e){say("Your browser could not reach GitHub ("+e.message+"). Check your internet, turn off any VPN or ad blocker, and try again. You can also run the bot by hand: Actions tab, news, Run workflow.")}};
</script></body></html>
