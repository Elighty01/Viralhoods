name: news
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser || true
      - run: python bot/fetch_news.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      - run: |
          mkdir -p public/data docs/data dist/data
          cp data/news.json public/data/news.json
          cp data/news.json docs/data/news.json || true
          cp data/news.json dist/data/news.json || true
          git config user.name "viralhoods-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news.json public/data/news.json docs/data/news.json || true
          git diff --cached --quiet || (git commit -m "Automated viral news scrape (12 AM UTC)" && git push)
